---
"rescore_bits is stored in the mapping":
  - do:
      indices.get_mapping:
        index: rescore_bits_test

  - match: { rescore_bits_test.mappings.properties.vector.index_options.rescore_bits: 4 }

---
"search rescores with quantized codes by default and with raw vectors on request":
  - do:
      search:
        index: rescore_bits_test
        body:
          knn:
            field: vector
            k: 3
            num_candidates: 10
            visit_percentage: 100
            rescore_vector:
              oversample: 2
            query_vector: [0.077,  0.32 , -0.205,  0.63 ,  0.032,  0.201,  0.167, -0.313,
                           0.176,  0.531, -0.375,  0.334, -0.046,  0.078, -0.349,  0.272,
                           0.307, -0.083,  0.504,  0.255, -0.404,  0.289, -0.226, -0.132,
