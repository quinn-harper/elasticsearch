  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "1" }

---
"rescore_bits can be updated":
  - do:
      indices.put_mapping:
        index: rescore_bits_test
        body:
          properties:
            vector:
              type: dense_vector
              dims: 64
              index: true
              similarity: l2_norm
              index_options:
                type: bbq_disk
                rescore_bits: 8

  - do:
      indices.get_mapping:
        index: rescore_bits_test

  - match: { rescore_bits_test.mappings.properties.vector.index_options.rescore_bits: 8 }

