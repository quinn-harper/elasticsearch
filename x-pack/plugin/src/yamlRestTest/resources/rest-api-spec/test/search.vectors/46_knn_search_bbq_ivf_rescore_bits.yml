setup:
  - requires:
      cluster_features: ["mapper.vectors.diskbbq_rescore_bits"]
      reason: Needs rescore_bits support for bbq_disk
  - skip:
      features: "headers"
  - do:
      indices.create:
        index: rescore_bits_test
        body:
          settings:
            index:
              number_of_shards: 1
              dense_vector.experimental_features: true
          mappings:
            properties:
              vector:
                type: dense_vector
                dims: 64
                index: true
                similarity: l2_norm
                index_options:
                  type: bbq_disk
                  rescore_bits: 4

  - do:
      index:
        index: rescore_bits_test
        id: "1"
        body:
          vector: [0.077,  0.32 , -0.205,  0.63 ,  0.032,  0.201,  0.167, -0.313,
                   0.176,  0.531, -0.375,  0.334, -0.046,  0.078, -0.349,  0.272,
